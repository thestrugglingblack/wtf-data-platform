name: "analytics"
version: "1.0.0"
config-version: 2

profile: "analytics"

model-paths:
  - "models"

analysis-paths:
  - "analyses"

test-paths:
  - "tests"

seed-paths:
  - "seeds"

macro-paths:
  - "macros"

snapshot-paths:
  - "snapshots"

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  release_version: "v0.2.0"

models:
  analytics:

    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts