version: 2

sources:
  - name: canonical
    description: >
      Canonical WTF datasets published by wtf-data-platform.
      These immutable Parquet files are the input boundary for
      the WTF analytics layer.

    meta:
      external_location: "../data/releases/{{ var('release_version') }}/datasets/{name}.parquet"

    tables:
      - name: teams
        description: >
          Canonical team records by league and season.

      - name: players
        description: >
          Canonical player identity records.

      - name: rosters
        description: >
          Canonical player roster records by league, season,
          and team.

      - name: games
        description: >
          Canonical game schedule and result records.

      - name: player_game_stats
        description: >
          Canonical player-level game statistics.

      - name: player_season_stats
        description: >
          Canonical player-level season statistics.

      - name: team_season_stats
        description: >
          Canonical team-level season statistics.

      - name: standings
        description: >
          Canonical league standings records.